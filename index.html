<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLET Complete Online/Offline CBT Platform (50 Sets · 7,500 Unique Questions)</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --purple: #7c3aed;
      --indigo: #4f46e5;
      --amber: #d97706;
    }
    body.dark {
      --bg: #020617;
      --surface: #0f172a;
      --surface-alt: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, 0.18);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tabular { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; }
    header.topbar {
      height: 62px;
      background: #0f172a;
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand-badge {
      width: 36px; height: 36px; border-radius: 8px;
      background: #2563eb; color: #fff; font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 15px; border-radius: 8px; font-weight: 700; font-size: 13px;
      border: 1px solid transparent; cursor: pointer; transition: 0.15s ease;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-outline {
      background: var(--surface); color: var(--text); border-color: var(--border);
    }
    .btn-outline:hover { background: var(--surface-alt); }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 16px; width: 100%; }
    .hero {
      background: #0f172a; color: #fff; border-radius: 16px; padding: 24px;
      margin-bottom: 24px; border: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .sets-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }
    .set-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; display: flex; flex-direction: column;
      justify-content: space-between; gap: 14px;
    }
    .set-card:hover { border-color: var(--primary); }
    .exam-layout {
      display: flex; flex: 1; height: calc(100vh - 62px); overflow: hidden;
    }
    .exam-main {
      flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column;
    }
    .q-card {
      max-width: 900px; width: 100%; margin: 0 auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; padding: 24px;
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
    }
    .opt-btn {
      width: 100%; text-align: left; padding: 14px 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
      margin-bottom: 10px; font-size: 15px; font-family: inherit; transition: 0.15s;
    }
    .opt-btn:hover { border-color: var(--primary); background: var(--surface-alt); }
    .opt-btn.selected {
      border-color: var(--primary); background: var(--primary-soft);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .opt-btn.correct {
      border-color: var(--success); background: var(--success-soft); font-weight: 600;
    }
    .opt-btn.wrong {
      border-color: var(--danger); background: var(--danger-soft);
    }
    .opt-key {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px; flex-shrink: 0; background: var(--surface-alt);
    }
    .opt-btn.selected .opt-key { background: var(--primary); color: #fff; border-color: var(--primary); }
    .palette-sidebar {
      width: 360px; background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .palette-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; padding: 14px;
    }
    .p-btn {
      height: 35px; border-radius: 6px; border: 1px solid var(--border);
      font-weight: 700; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-alt); color: var(--text);
    }
    .p-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }
    .p-btn.answered { background: #15803d; color: #fff; border-color: #15803d; }
    .p-btn.not_answered { background: #dc2626; color: #fff; border-color: #dc2626; }
    .p-btn.marked_for_review { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .p-btn.answered_and_marked { background: #4f46e5; color: #fff; border: 2px solid #4ade80; }
    .timer-pill {
      padding: 6px 12px; border-radius: 8px; background: #1e293b;
      border: 1px solid #334155; color: #4ade80; font-weight: 800; font-size: 15px;
    }
    .timer-pill.low { background: #450a0a; border-color: #ef4444; color: #fca5a5; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th, table.data-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left;
    }
    table.data-table th { background: var(--surface-alt); font-weight: 700; }
    @media (max-width: 1024px) {
      .exam-layout { flex-direction: column; height: auto; }
      .palette-sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
    .auth-wrap { max-width: 520px; margin: 45px auto; padding: 24px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
    .auth-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-alt); color: var(--text); margin: 6px 0 14px; font: inherit; }
    .auth-message { min-height: 24px; font-size: 13px; margin-top: 12px; color: var(--text-muted); }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function() {
      const SETS = await Promise.all(
        Array.from({ length: 50 }, (_, i) =>
          fetch(`data/set-${String(i + 1).padStart(2, '0')}.json`)
            .then(response => {
              if (!response.ok) throw new Error(`Question set ${i + 1} could not be loaded`);
              return response.json();
            })
        )
      );
      // Supabase public browser configuration. Publishable keys are safe in frontend code.
      const SUPABASE_URL = 'https://hhtsvutudubhtvzurdwh.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_SFuWy1vi6Tggtm3opo9yvg_suq4rPv-';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const STORAGE_PREFIX = 'blet_standalone_cbt_v1_';
      let state = {
        view: 'dashboard', // 'dashboard' | 'instructions' | 'exam' | 'result'
        darkMode: localStorage.getItem(STORAGE_PREFIX + 'dark') === 'true',
        candidateName: localStorage.getItem(STORAGE_PREFIX + 'name') || 'अभ्यर्थी (BLET Candidate)',
        searchQuery: '',
        activeSet: SETS[0],
        mode: 'exam', // 'exam' | 'practice'
        currentIdx: 0,
        remainingSeconds: 150 * 60,
        responses: {}, // idx -> 'A'|'B'|'C'|'D'|null
        palette: {}, // idx -> status
        selectedDraft: null,
        showPracticeAns: false,
        resultFilter: 'all',
        timerHandle: null,
        lastResult: null,
        authUser: null,
        subscription: null,
        authMode: 'signup',
        authMessage: ''
      };

      if (state.darkMode) document.body.classList.add('dark');

      function toggleTheme() {
        state.darkMode = !state.darkMode;
        document.body.classList.toggle('dark', state.darkMode);
        localStorage.setItem(STORAGE_PREFIX + 'dark', String(state.darkMode));
        render();
      }

      function formatMMSS(sec) {
        const s = Math.max(0, sec);
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
      }

      function getSavedResult(setNo) {
        try {
          const raw = localStorage.getItem(STORAGE_PREFIX + 'result_' + setNo);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }

      function openInstructions(setNo, mode) {
        const found = SETS.find(s => s.no === setNo) || SETS[0];
        state.activeSet = found;
        state.mode = mode || 'exam';
        state.view = 'instructions';
        render();
      }

      function startExam() {
        if (!hasActiveAccess()) {
          alert('आपकी Membership सक्रिय नहीं है। कृपया Login करके ₹199 का भुगतान करें।');
          state.view = state.authUser ? 'dashboard' : 'auth'; render(); return;
        }
        const nameInput = document.getElementById('cand-name-input');
        const agreeBox = document.getElementById('agree-check');
        if (agreeBox && !agreeBox.checked) {
          alert('कृपया परीक्षा प्रारंभ करने से पूर्व सहमति चेकबॉक्स पर टिक करें।');
          return;
        }
        if (nameInput && nameInput.value.trim()) {
          state.candidateName = nameInput.value.trim();
          localStorage.setItem(STORAGE_PREFIX + 'name', state.candidateName);
        }
        state.currentIdx = 0;
        state.remainingSeconds = 150 * 60;
        state.responses = {};
        state.palette = { 0: 'not_answered' };
        for (let i = 1; i < state.activeSet.qs.length; i++) {
          state.palette[i] = 'not_visited';
        }
        state.selectedDraft = null;
        state.showPracticeAns = false;
        state.view = 'exam';

        if (state.timerHandle) clearInterval(state.timerHandle);
        state.timerHandle = setInterval(() => {
          if (state.view !== 'exam') return;
          state.remainingSeconds--;
          const timerEl = document.getElementById('live-timer');
          if (timerEl) {
            timerEl.textContent = formatMMSS(state.remainingSeconds);
            if (state.remainingSeconds <= 600) timerEl.classList.add('low');
          }
          if (state.remainingSeconds <= 0) {
            clearInterval(state.timerHandle);
            submitExam(true);
          }
        }, 1000);
        render();
      }

      function goToQuestion(idx) {
        const max = state.activeSet.qs.length - 1;
        const target = Math.max(0, Math.min(max, idx));
        if (state.palette[state.currentIdx] === 'not_visited' && !state.responses[state.currentIdx]) {
          state.palette[state.currentIdx] = 'not_answered';
        }
        if (state.palette[target] === 'not_visited') {
          state.palette[target] = 'not_answered';
        }
        state.currentIdx = target;
        state.selectedDraft = state.responses[target] || null;
        state.showPracticeAns = false;
        render();
      }

      function selectOption(optKey) {
        state.selectedDraft = optKey;
        render();
      }

      function saveAndNext() {
        const idx = state.currentIdx;
        state.responses[idx] = state.selectedDraft || null;
        state.palette[idx] = state.selectedDraft ? 'answered' : 'not_answered';
        const nextIdx = idx < state.activeSet.qs.length - 1 ? idx + 1 : idx;
        if (state.palette[nextIdx] === 'not_visited') state.palette[nextIdx] = 'not_answered';
        state.currentIdx = nextIdx;
        state.selectedDraft = state.responses[nextIdx] || null;
        state.showPracticeAns = false;
        render();
      }

      function markReviewAndNext() {
        const idx = state.currentIdx;
        state.responses[idx] = state.selectedDraft || null;
        state.palette[idx] = state.selectedDraft ? 'answered_and_marked' : 'marked_for_review';
        const nextIdx = idx < state.activeSet.qs.length - 1 ? idx + 1 : idx;
        if (state.palette[nextIdx] === 'not_visited') state.palette[nextIdx] = 'not_answered';
        state.currentIdx = nextIdx;
        state.selectedDraft = state.responses[nextIdx] || null;
        state.showPracticeAns = false;
        render();
      }

      function clearResponse() {
        const idx = state.currentIdx;
        state.selectedDraft = null;
        state.responses[idx] = null;
        state.palette[idx] = 'not_answered';
        render();
      }

      function submitExam(auto) {
        if (!auto) {
          let att = 0;
          Object.values(state.responses).forEach(v => { if (v) att++; });
          if (!confirm('क्या आप परीक्षा सबमिट करना चाहते हैं? कुल हल किए गए प्रश्न: ' + att + ' / ' + state.activeSet.qs.length)) {
            return;
          }
        }
        if (state.timerHandle) clearInterval(state.timerHandle);

        const qs = state.activeSet.qs;
        let correct = 0, incorrect = 0, unattempted = 0;
        let libCorrect = 0, libTotal = 0, gkCorrect = 0, gkTotal = 0;

        qs.forEach((q, i) => {
          const ans = state.responses[i] || null;
          if (q.s === 'L') libTotal++; else gkTotal++;
          if (!ans) {
            unattempted++;
          } else if (ans === q.a) {
            correct++;
            if (q.s === 'L') libCorrect++; else gkCorrect++;
          } else {
            incorrect++;
          }
        });

        const attempted = correct + incorrect;
        const pct = ((correct / qs.length) * 100).toFixed(2);
        const acc = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : '0.0';
        const resultObj = {
          setNo: state.activeSet.no,
          setCode: state.activeSet.code,
          setTitle: state.activeSet.title,
          candidateName: state.candidateName,
          dateStr: new Date().toLocaleString('hi-IN'),
          timeTakenSec: Math.max(1, 150 * 60 - state.remainingSeconds),
          total: qs.length,
          attempted,
          correct,
          incorrect,
          unattempted,
          pct,
          acc,
          libCorrect,
          libTotal,
          gkCorrect,
          gkTotal,
          responses: { ...state.responses }
        };

        try {
          localStorage.setItem(STORAGE_PREFIX + 'result_' + state.activeSet.no, JSON.stringify(resultObj));
        } catch (e) {}

        state.lastResult = resultObj;
        state.resultFilter = 'all';
        state.view = 'result';
        render();
      }

      async function refreshMembership() {
        if (!state.authUser) { state.subscription = null; return false; }
        const { data, error } = await supabase.from('subscriptions')
          .select('id, starts_at, ends_at, status')
          .eq('user_id', state.authUser.id).eq('status', 'active')
          .gt('ends_at', new Date().toISOString())
          .order('ends_at', { ascending: false }).limit(1).maybeSingle();
        if (error) { console.error('Subscription lookup failed:', error); state.subscription = null; return false; }
        state.subscription = data || null;
        return !!state.subscription;
      }

      function hasActiveAccess() {
        return !!(state.subscription && state.subscription.status === 'active' &&
          new Date(state.subscription.ends_at).getTime() > Date.now());
      }

      async function initializeAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        state.authUser = session?.user || null;
        if (state.authUser) await refreshMembership();
        supabase.auth.onAuthStateChange((_event, sessionNow) => {
          setTimeout(async () => {
            state.authUser = sessionNow?.user || null;
            if (state.authUser) await refreshMembership(); else state.subscription = null;
            if (state.view !== 'exam' && state.view !== 'result') {
              state.view = state.authUser ? 'dashboard' : 'auth'; render();
            }
          }, 0);
        });
        state.view = state.authUser ? 'dashboard' : 'auth';
        render();
      }

      async function signUpOrSignIn(mode) {
        const email = document.getElementById('auth-email')?.value.trim();
        const password = document.getElementById('auth-password')?.value || '';
        const name = document.getElementById('auth-name')?.value.trim() || '';
        const msg = document.getElementById('auth-message');
        if (!email || !password) { if (msg) msg.textContent = 'कृपया ईमेल और पासवर्ड भरें।'; return; }
        if (password.length < 6) { if (msg) msg.textContent = 'पासवर्ड कम-से-कम 6 अक्षरों का होना चाहिए।'; return; }
        if (msg) msg.textContent = 'कृपया प्रतीक्षा करें…';
        const result = mode === 'signup'
          ? await supabase.auth.signUp({ email, password, options: { data: { full_name: name } } })
          : await supabase.auth.signInWithPassword({ email, password });
        if (result.error) { if (msg) msg.textContent = result.error.message; return; }
        if (mode === 'signup' && !result.data.session) {
          if (msg) msg.textContent = 'Registration सफल। ईमेल में confirmation link खोलें, फिर Login करें।'; return;
        }
        state.authUser = result.data.user || result.data.session?.user || null;
        if (state.authUser) { await refreshMembership(); state.view = 'dashboard'; render(); }
      }

      async function signOut() {
        await supabase.auth.signOut();
        state.authUser = null; state.subscription = null; state.view = 'auth'; render();
      }

      function switchAuthMode(mode) { state.authMode = mode; state.authMessage = ''; render(); }

      async function openInstructions(setNo, mode) {
        if (!state.authUser) { state.view = 'auth'; state.authMessage = 'CBT शुरू करने से पहले Student Login करें।'; render(); return; }
        await refreshMembership();
        if (!hasActiveAccess()) {
          state.view = 'dashboard'; render();
          alert('CBT Access के लिए पहले ₹199 का भुगतान करके 180 दिन की Membership सक्रिय करें।'); return;
        }
        state.activeSet = SETS.find(s => s.no === setNo) || SETS[0];
        state.mode = mode || 'exam'; state.view = 'instructions'; render();
      }

      async function payNow() {
        const showStatus = (message, isError = false) => {
          const el = document.getElementById('payment-status');
          if (el) { el.textContent = message; el.style.color = isError ? '#fecaca' : '#bbf7d0'; }
        };
        if (!state.authUser) { state.view = 'auth'; state.authMessage = 'भुगतान से पहले Student Login करें।'; render(); return; }
        if (hasActiveAccess()) { showStatus('आपकी Membership पहले से सक्रिय है।'); return; }
        if (!window.Razorpay) { showStatus('Razorpay Checkout लोड नहीं हुआ। पेज Refresh करें।', true); return; }

        try {
          showStatus('सुरक्षित Order बनाया जा रहा है…');
          const { data: { session } } = await supabase.auth.getSession();
          if (!session?.access_token) throw new Error('Login session समाप्त है। दोबारा Login करें।');
          const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Authorization': `Bearer ${session.access_token}` };
          const orderResponse = await fetch(`${SUPABASE_URL}/functions/v1/create-payment-order`,
            { method: 'POST', headers, body: JSON.stringify({}) });
          const order = await orderResponse.json();
          if (!orderResponse.ok || !order.order_id) throw new Error(order.error || order.message || 'Order नहीं बन सका।');

          const options = {
            key: order.key_id, amount: order.amount, currency: order.currency || 'INR',
            name: 'BLET Complete CBT Test Series',
            description: '50 CBT Sets · 7,500 Questions · 180 Days Access',
            order_id: order.order_id, prefill: { email: state.authUser.email || '' },
            handler: async function (response) {
              try {
                showStatus('Payment की server-side पुष्टि की जा रही है…');
                const { data: { session: freshSession } } = await supabase.auth.getSession();
                if (!freshSession?.access_token) throw new Error('Login session समाप्त हो गया। दोबारा Login करें।');
                const verifyResponse = await fetch(`${SUPABASE_URL}/functions/v1/verify-payment`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_PUBLISHABLE_KEY,
                    'Authorization': `Bearer ${freshSession.access_token}` },
                  body: JSON.stringify(response)
                });
                const verification = await verifyResponse.json();
                if (!verifyResponse.ok || verification.success !== true)
                  throw new Error(verification.error || verification.message || 'Payment verify नहीं हुआ।');
                await refreshMembership();
                if (!hasActiveAccess()) throw new Error('Payment verify हुआ, लेकिन Membership रिकॉर्ड नहीं मिला। Admin से संपर्क करें।');
                showStatus('भुगतान सफल! आपकी 180 दिन की Membership सक्रिय है।');
                alert('भुगतान सफल! आपका BLET CBT Access 180 दिनों के लिए सक्रिय हो गया है।');
                state.view = 'dashboard'; render();
              } catch (error) { showStatus(error.message || 'Payment verification में समस्या आई।', true); }
            },
            modal: { ondismiss: () => showStatus('Payment प्रक्रिया रद्द की गई। आप फिर प्रयास कर सकते हैं।', true) },
            theme: { color: '#1d4ed8' }
          };
          const checkout = new Razorpay(options);
          checkout.on('payment.failed', response => showStatus(response.error?.description || 'Payment असफल हुआ।', true));
          checkout.open();
        } catch (error) { showStatus(error.message || 'Payment शुरू नहीं हो सका।', true); }
      }

      window.BLET = {
        toggleTheme,
        payNow,
        openInstructions,
        signUpOrSignIn,
        switchAuthMode,
        signOut,
        startExam,
        goToQuestion,
        selectOption,
        saveAndNext,
        markReviewAndNext,
        clearResponse,
        submitExam,
        backHome: function() {
          if (state.timerHandle) clearInterval(state.timerHandle);

          render();

          render();

        viewSavedResult: function(setNo) {
          const saved = getSavedResult(setNo);

          if (saved && found) {
            state.activeSet = found;
            state.lastResult = saved;
            state.resultFilter = 'all';
            state.view = 'result';
            render();
          }
        },
        onSearchInput: function(val) {
          state.searchQuery = val;
          render();
        }
      };

      function renderDashboard() {
        const qLower = state.searchQuery.trim().toLowerCase();
        const filtered = SETS.filter(s => {
          if (!qLower) return true;
          return (s.code + ' ' + s.title + ' ' + s.sub).toLowerCase().includes(qLower);

                  यह वेब सीबीटी फाइल बिना इंटरनेट या सर्वर के किसी भी कंप्यूटर, लैपटॉप या मोबाइल ब्राउज़र में सीधे चलती है। प्रत्येक सेट में 100 Library Science + 50 General Knowledge = 150 अद्वितीय प्रश्न विस्तृत हिंदी व्याख्या सहित शामिल हैं।
                </p>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;min-width:230px;">
                ${hasActiveAccess()
                  ? `<div style="padding:10px 12px;border-radius:8px;background:#14532d;color:#dcfce7;font-size:12px;font-weight:700;">✓ Membership सक्रिय · ${new Date(state.subscription.ends_at).toLocaleDateString('hi-IN')} तक</div>`

                <div class="tabular" style="font-size:24px;font-weight:800;margin-top:4px;">${SETS.length} Sets</div>
              </div>
              <div class="kpi-card">

              </div>
            </div>

            <div class="sets-grid">${cardsHtml}</div>
          </div>
        `;
      }

      function renderInstructions() {

        return `

      function renderExam() {
        const s = state.activeSet;
        const q = s.qs[state.currentIdx];
        let ansCount = 0, notAnsCount = 0, notVisCount = 0, revCount = 0;
        for (let i = 0; i < s.qs.length; i++) {
          const st = state.palette[i] || 'not_visited';
          if (st === 'answered' || st === 'answered_and_marked') ansCount++;
          else if (st === 'not_answered') notAnsCount++;
          else if (st === 'marked_for_review') revCount++;
          else notVisCount++;
        }

        const optsHtml = ['A', 'B', 'C', 'D'].map(k => {
          const isSel = state.selectedDraft === k;
          let cls = 'opt-btn' + (isSel ? ' selected' : '');
          if (state.mode === 'practice' && state.showPracticeAns) {
            if (q.a === k) cls = 'opt-btn correct';
            else if (isSel && q.a !== k) cls = 'opt-btn wrong';
          }
          return `
            <button type="button" class="${cls}" onclick="BLET.selectOption('${k}')">
              <span class="opt-key">${k}</span>
              <span style="flex:1;">${q.o[k]}</span>
            </button>
          `;
        }).join('');

        const paletteHtml = s.qs.map((item, idx) => {
          const st = state.palette[idx] || 'not_visited';
          const cur = idx === state.currentIdx ? ' current' : '';
          return `<button type="button" class="p-btn tabular ${st}${cur}" onclick="BLET.goToQuestion(${idx})">${item.n}</button>`;
        }).join('');

        return `
          <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">

              <button class="btn ${q.s === 'G' ? 'btn-primary' : 'btn-outline'}" style="padding:6px 12px;font-size:12px;" onclick="BLET.goToQuestion(100)">सामान्य ज्ञान (101–150)</button>

                    <div>
                      <span class="tabular" style="font-size:18px;font-weight:800;color:var(--primary);">प्रश्न संख्या ${q.n} / ${s.qs.length}</span>
                      <span style="font-size:12px;color:var(--text-muted);margin-left:8px;">· ${q.u} (${q.ut})</span>
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);">${q.t} · स्तर: ${q.d} · +1.0 अंक</div>

                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
                      <button class="btn btn-outline" onclick="BLET.togglePracticeAns()">👁 ${state.showPracticeAns ? 'उत्तर छिपाएँ' : 'सही उत्तर एवं व्याख्या देखें'}</button>
                      ${state.showPracticeAns ? `
                        <div style="margin-top:12px;padding:14px;border-radius:10px;background:var(--success-soft);border:1px solid var(--success);font-size:13.5px;">
                          <div style="font-weight:800;margin-bottom:4px;">सही उत्तर: विकल्प (${q.a}) — ${q.o[q.a]}</div>

                  <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-outline" onclick="BLET.goToQuestion(${state.currentIdx - 1})" ${state.currentIdx === 0 ? 'disabled' : ''}>← पिछला</button>

                  <div style="display:flex;gap:10px;">
                    <button class="btn btn-success" onclick="BLET.saveAndNext()">सहेजें और आगे बढ़ें (Save & Next) →</button>

            </aside>
          </div>

      function renderResult() {
        const r = state.lastResult;
        const s = state.activeSet;
        const filteredQs = s.qs.map((q, idx) => {
          const uAns = r.responses[idx] || null;
          const st = !uAns ? 'unattempted' : (uAns === q.a ? 'correct' : 'incorrect');
          return { q, idx, uAns, st };
        }).filter(item => state.resultFilter === 'all' || item.st === state.resultFilter);

        const reviewHtml = filteredQs.map(({ q, uAns, st }) => `
          <div style="padding:18px;border-bottom:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;">
              <strong>प्रश्न #${q.n} · ${q.u} (${q.t})</strong>
              <span style="font-weight:800;color:${st === 'correct' ? '#16a34a' : st === 'incorrect' ? '#dc2626' : 'var(--text-muted)'};">
                ${st === 'correct' ? '✓ सही (+1)' : st === 'incorrect' ? '✗ गलत (0)' : '○ छोड़ा गया'}

            </div>
            <div style="font-size:15px;font-weight:700;margin-bottom:10px;white-space:pre-line;">${q.q}</div>

              ${['A', 'B', 'C', 'D'].map(k => `
                <div style="padding:8px 10px;border-radius:8px;border:1px solid ${q.a === k ? '#16a34a' : (uAns === k ? '#dc2626' : 'var(--border)')};background:${q.a === k ? 'var(--success-soft)' : (uAns === k ? 'var(--danger-soft)' : 'var(--surface)')};">

              `).join('')}
            </div>
            <div style="font-size:12.5px;padding:10px;border-radius:8px;background:var(--surface-alt);">
              <strong>आपका उत्तर:</strong> ${uAns || 'अनुत्तरित'} · <strong style="color:var(--success);">सही उत्तर: (${q.a})</strong><br/>
              <strong>व्याख्या:</strong> ${q.e}
            </div>
          </div>
        `).join('');

        return `
          <header class="topbar no-print">
            <div class="brand" onclick="BLET.backHome()">
              <div class="brand-badge">BLET</div>
              <div style="font-weight:800;">${r.setTitle} — परीक्षा परिणाम एवं उत्तर कुंजी</div>

          </header>
          <div class="container">
            <div class="hero">
              <div>
                <div style="font-size:11px;color:#60a5fa;font-weight:700;">BLET OFFICIAL SCORECARD · ${r.setCode}</div>
                <h1 style="font-size:24px;font-weight:800;">अभ्यर्थी: ${r.candidateName}</h1>
                <p style="font-size:12px;color:#cbd5e1;">दिनांक: ${r.dateStr} · समय: ${Math.floor(r.timeTakenSec / 60)} मिनट ${r.timeTakenSec % 60} सेकंड</p>
              </div>
              <div class="tabular" style="text-align:right;">
                <div style="font-size:32px;font-weight:800;color:#4ade80;">${r.correct} / ${r.total} (${r.pct}%)</div>
                <div style="font-size:12px;color:#cbd5e1;">सटीकता (Accuracy): ${r.acc}% · Lib Sci: ${r.libCorrect}/${r.libTotal} · GK: ${r.gkCorrect}/${r.gkTotal}</div>
              </div>
            </div>

            <div class="kpi-grid">
              <div class="kpi-card"><div>कुल प्रयास</div><div class="tabular" style="font-size:22px;font-weight:800;">${r.attempted} / ${r.total}</div></div>
              <div class="kpi-card"><div>सही उत्तर (+1)</div><div class="tabular" style="font-size:22px;font-weight:800;color:var(--success);">${r.correct}</div></div>
              <div class="kpi-card"><div>गलत उत्तर (0)</div><div class="tabular" style="font-size:22px;font-weight:800;color:var(--danger);">${r.incorrect}</div></div>
              <div class="kpi-card"><div>छोड़े गए प्रश्न</div><div class="tabular" style="font-size:22px;font-weight:800;">${r.unattempted}</div></div>
            </div>

            <div class="kpi-card" style="padding:0;overflow:hidden;">
              <div class="no-print" style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
                <strong style="font-size:15px;">संपूर्ण 150-प्रश्न उत्तर कुंजी एवं व्याख्या समीक्षा</strong>
                <div style="display:flex;gap:6px;">
                  <button class="btn ${state.resultFilter === 'all' ? 'btn-primary' : 'btn-outline'}" onclick="BLET.setResultFilter('all')">सभी (150)</button>
                  <button class="btn ${state.resultFilter === 'correct' ? 'btn-primary' : 'btn-outline'}" onclick="BLET.setResultFilter('correct')">सही (${r.correct})</button>
                  <button class="btn ${state.resultFilter === 'incorrect' ? 'btn-primary' : 'btn-outline'}" onclick="BLET.setResultFilter('incorrect')">गलत (${r.incorrect})</button>
                  <button class="btn ${state.resultFilter === 'unattempted' ? 'btn-primary' : 'btn-outline'}" onclick="BLET.setResultFilter('unattempted')">छोड़े (${r.unattempted})</button>
                </div>
              </div>
              <div>${reviewHtml}</div>
            </div>
          </div>
        `;
      }


      function renderAuth() {
        const isSignup = state.authMode === 'signup';
        return `
          <header class="topbar">
            <div class="brand"><div class="brand-badge">BLET</div><div style="font-weight:800;">BLET Student Portal</div></div>
            <button class="btn btn-outline" style="background:#1e293b;color:#fff;border-color:#334155;" onclick="BLET.toggleTheme()">${state.darkMode ? '☀ Light' : '☾ Dark'}</button>
          </header>
          <div class="auth-wrap"><div class="auth-card">
            <h1 style="font-size:24px;margin-bottom:6px;">${isSignup ? 'Student Registration' : 'Student Login'}</h1>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">BLET CBT के लिए अपना अकाउंट बनाएँ या Login करें। CBT शुरू करने के लिए 180 दिन की सक्रिय Membership आवश्यक है।</p>
            ${isSignup ? `<label style="font-size:13px;font-weight:700;">पूरा नाम</label><input class="auth-input" id="auth-name" type="text" autocomplete="name" placeholder="अपना नाम लिखें">` : ''}
            <label style="font-size:13px;font-weight:700;">ईमेल</label>
            <input class="auth-input" id="auth-email" type="email" autocomplete="email" placeholder="name@example.com">
            <label style="font-size:13px;font-weight:700;">पासवर्ड</label>
            <input class="auth-input" id="auth-password" type="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" placeholder="कम-से-कम 6 अक्षर">
            <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="BLET.signUpOrSignIn('${isSignup ? 'signup' : 'login'}')">${isSignup ? 'अकाउंट बनाएँ' : 'Login करें'}</button>
            <div class="auth-message" id="auth-message">${state.authMessage || ''}</div>
            <div style="margin-top:10px;font-size:13px;text-align:center;">
              ${isSignup ? `पहले से अकाउंट है? <a href="#" onclick="event.preventDefault();BLET.switchAuthMode('login')">Login करें</a>`
                : `नया विद्यार्थी हैं? <a href="#" onclick="event.preventDefault();BLET.switchAuthMode('signup')">Registration करें</a>`}
            </div>
          </div></div>
        `;
      }

      function render() {
        const root = document.getElementById('app');
        if (state.view === 'auth') root.innerHTML = renderAuth();
        else if (state.view === 'instructions') root.innerHTML = renderInstructions();
        else if (state.view === 'exam') root.innerHTML = renderExam();
        else if (state.view === 'result') root.innerHTML = renderResult();
        else root.innerHTML = renderDashboard();
      }

      initializeAuth().catch(error => { console.error(error); state.view = 'auth'; render(); });
    })();
  </script>
</body>
</html>
